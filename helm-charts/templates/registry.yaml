{{- range $v := .Values.registry }}
---
apiVersion: gounix.nl/v1
kind: Registry
metadata:
  name: {{ $v.name }}
spec:
  scheme: "{{ $v.scheme }}"
  tlsVerify: {{ $v.tlsVerify }}
  host: "{{ $v.host }}"
  supportChunkedUpload: {{ $v.supportChunkedUpload }}
  authenticated: {{ $v.authenticated }}
  secretName: "{{ $v.secretName }}"
{{- end }}
